<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a7c9d"/>
      <stop offset="100%" stop-color="#2d526a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f3ec"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner schedule board card -->
  <rect x="76" y="76" width="360" height="360" rx="44" fill="url(#cardGrad)" filter="url(#shadow)"/>

  <!-- Top bar clip/hanger -->
  <rect x="180" y="52" width="152" height="42" rx="18" fill="#e07a5f"/>
  <circle cx="256" cy="73" r="10" fill="#ffffff"/>

  <!-- Task item 1 (checked) -->
  <rect x="116" y="128" width="280" height="66" rx="18" fill="#e3f1dc"/>
  <circle cx="152" cy="161" r="18" fill="#3b8a4a"/>
  <!-- Checkmark -->
  <path d="M144 161l5 5 11-11" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Clock icon -->
  <circle cx="196" cy="161" r="14" fill="#ffffff"/>
  <path d="M196 153v8l5 3" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Text line -->
  <rect x="224" y="154" width="144" height="14" rx="7" fill="#2b2f36" opacity="0.8"/>

  <!-- Task item 2 (current active star) -->
  <rect x="116" y="210" width="280" height="66" rx="18" fill="#dcebf5" stroke="#4a7c9d" stroke-width="3"/>
  <circle cx="152" cy="243" r="18" fill="#4a7c9d"/>
  <!-- Star -->
  <path d="M152 233l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2-4.5-4.4 6.2-.9z" fill="#ffffff"/>
  <!-- Text line -->
  <rect x="186" y="236" width="120" height="14" rx="7" fill="#2b2f36"/>
  <!-- Time badge -->
  <rect x="320" y="233" width="58" height="20" rx="10" fill="#ffffff"/>
  <circle cx="330" cy="243" r="3" fill="#e07a5f"/>

  <!-- Task item 3 (playful toy/fun) -->
  <rect x="116" y="292" width="280" height="66" rx="18" fill="#fbeed3"/>
  <circle cx="152" cy="325" r="18" fill="#e07a5f"/>
  <!-- Smile -->
  <circle cx="152" cy="325" r="12" fill="#ffffff"/>
  <circle cx="147" cy="322" r="2" fill="#2b2f36"/>
  <circle cx="157" cy="322" r="2" fill="#2b2f36"/>
  <path d="M147 327q5 4 10 0" stroke="#2b2f36" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Text lines -->
  <rect x="186" y="318" width="150" height="14" rx="7" fill="#7a7f87" opacity="0.6"/>

  <!-- Cute timer progress dot at bottom -->
  <circle cx="256" cy="392" r="16" fill="#e07a5f"/>
  <text x="256" y="398" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">⏱</text>
</svg>
